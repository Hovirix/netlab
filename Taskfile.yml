version: '3'

tasks:
  build:
    desc: Validate, render, and build firmware
    deps: [validate, render]
    cmds:
      - ./scripts/build.sh

  deploy:
    desc: Deploy firmware to the router
    prompt: Flash router with sysupgrade -n?
    cmds:
      - ./scripts/deploy.sh
      - task: clean

  update:
    desc: Update OpenWrt release metadata
    cmds:
      - python3 ./scripts/update.py

  check:
    desc: Run non-secret static checks
    cmds:
      - actionlint .github/workflows/*.yml

  render:
    internal: true
    run: once
    cmds:
      - ./scripts/render.sh

  validate:
    internal: true
    cmds:
      - task: render
      - ./scripts/validate.sh

  clean:
    cmds:
      - rm -rf build
