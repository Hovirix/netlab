version: '3'

set: [errexit, nounset, pipefail]

env:
  BUILD_DIR: '{{.ROOT_DIR}}/build'
  DOWNLOADS_DIR: '{{.ROOT_DIR}}/build/downloads'
  OVERLAY_DIR: '{{.ROOT_DIR}}/build/files'
  ARTIFACTS_DIR: '{{.ROOT_DIR}}/build/artifacts'

tasks:
  check:
    desc: Run static checks
    cmds:
      - nix flake check --print-build-logs

  render:
    internal: true
    sources:
      - config/router.yaml
      - config/secrets.sops.yaml
      - templates/**/*.tmpl
      - scripts/render.sh
    generates:
      - build/files/etc/config/network
      - build/files/etc/config/firewall
      - build/files/etc/config/dhcp
      - build/files/etc/config/wireless
      - build/files/etc/config/dropbear
      - build/files/etc/adguardhome/adguardhome.yaml
      - build/files/etc/dropbear/authorized_keys
      - build/files/etc/uci-defaults/99-service
    preconditions:
      - sh: test -r config/secrets.sops.yaml
        msg: Encrypted secrets file is missing
    cmd: ./scripts/render.sh

  validate:
    internal: true
    cmds:
      - task: render
      - ./scripts/validate.sh

  build:
    desc: Render, validate and build firmware
    cmds:
      - defer: rm -rf "$OVERLAY_DIR"
      - task: validate
      - cmd: ./scripts/build.sh
        timeout: 45m

  deploy:
    desc: Deploy firmware to router
    prompt: Flash router with sysupgrade -n?
    cmds:
      - task: build
      - ./scripts/deploy.sh
      - task: clean

  update:
    desc: Update OpenWrt
    cmd: python3 scripts/update.py

  clean:
    desc: Remove build artifacts
    cmd: rm -rf "${BUILD_DIR:?}"
