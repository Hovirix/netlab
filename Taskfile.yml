version: '3'

set: [errexit, nounset, pipefail]

env:
  BUILD_DIR: '{{.ROOT_DIR}}/build'
  DOWNLOADS_DIR: '{{.ROOT_DIR}}/build/downloads'
  OVERLAY_DIR: '{{.ROOT_DIR}}/build/files'
  ARTIFACTS_DIR: '{{.ROOT_DIR}}/build/artifacts'

tasks:
  check:
    desc: Run static checks and lint
    cmds:
      - deadnix --fail .
      - statix check .
      - ruff check .
      - shellcheck scripts/*.sh
      - typos --exclude 'config/*.sops.yaml' --exclude 'keys/*.asc' --exclude '*.lock' --exclude LICENSE
      - actionlint

  render:
    internal: true
    cmds:
      - cmd: cat tests/fixtures/secrets.yaml | ./scripts/render.sh
        if: '[ "${CI:-}" = "true" ]'
      - cmd: sops -d config/secrets.sops.yaml | ./scripts/render.sh
        if: '[ "${CI:-}" != "true" ]'

  validate:
    internal: true
    cmds:
      - task: render
      - ./scripts/validate.sh

  build:
    desc: Render, validate and build firmware
    cmds:
      - defer: rm -rf "$OVERLAY_DIR"
      - task: validate
      - cmd: ./scripts/build.sh
        timeout: 45m

  deploy:
    desc: Deploy firmware to router
    prompt: Flash router with sysupgrade -n?
    cmds:
      - task: build
      - ./scripts/deploy.sh
      - task: clean

  update:
    desc: Update OpenWrt
    cmd: python3 scripts/update.py

  clean:
    desc: Remove build artifacts
    cmd: rm -rf "${BUILD_DIR:?}"
