build:
  openwrt_version: 25.12.5
  target: mediatek
  subtarget: filogic
  profile: glinet_gl-mt6000
  imagebuilder_hash: sha256-f7bPYmWC68v7RpdNpIwerldyE/OIeer2sdmCBB6ENGE=

  packages:
    - adguardhome
    - etherwake
    - irqbalance
    - map
    - wireguard-tools

  router:
    host: 10.10.0.1
    user: root
    port: 22

vlans:
  management:
    id: 10
    gateway: 10.10.0.1
    cidr: 10.10.0.1/24
    dhcp: true
    wan: true

  proxmox:
    id: 20
    gateway: 10.20.0.1
    cidr: 10.20.0.1/24
    dhcp: false
    wan: true

  truenas:
    id: 30
    gateway: 10.30.0.1
    cidr: 10.30.0.1/24
    dhcp: true
    wan: true

  homelab:
    id: 40
    gateway: 10.40.0.1
    cidr: 10.40.0.1/24
    dhcp: true
    wan: true

  kubelab:
    id: 50
    gateway: 10.50.0.1
    cidr: 10.50.0.1/24
    dhcp: true
    wan: true

  cyberlab:
    id: 60
    gateway: 10.60.0.1
    cidr: 10.60.0.1/24
    dhcp: true
    wan: false

  clients:
    id: 70
    gateway: 10.70.0.1
    cidr: 10.70.0.1/24
    dhcp: true
    wan: true

switch:
  bridge: br-lan

  ports:
    - lan1
    - lan2
    - lan3
    - lan4
    - lan5

  vlans:
    management:
      - lan5:u*

    proxmox:
      - lan1:t
      - lan2:t

    truenas:
      - lan3:u*

    homelab:
      - lan1:t
      - lan2:t

    kubelab:
      - lan1:t
      - lan2:t

    cyberlab:
      - lan1:t
      - lan2:t

    clients: []

network:
  wan:
    map_type: map-e

  wan6:
    device: eth1
    client_id: "000300019483C4B743C5"
    dns:
      - "127.0.0.1"
      - "::1"

  vpn:
    name: vpn
    listen_port: 51820
    address: 10.255.0.1/24

dhcp:
  dnsmasq:
    name: main
    port: 0

  pools:
    start: 100
    limit: 150
    leasetime: 12h
    dhcpv4: server

  static_leases:
    - name: swarm-01
      mac: "02:40:00:00:01:01"
      ip: 10.40.0.101

    - name: swarm-02
      mac: "02:40:00:00:01:02"
      ip: 10.40.0.102

    - name: swarm-03
      mac: "02:40:00:00:01:03"
      ip: 10.40.0.103

firewall:
  defaults:
    input: REJECT
    output: ACCEPT
    forward: REJECT

  router_access:
    - src: wan
      proto: udp
      port: 51820
      reason: WireGuard listener

    - srcs:
        - management
        - vpn
      proto: tcp
      port: 443
      reason: Router HTTPS for local and remote administration

    - srcs:
        - management
        - vpn
      proto: tcp
      port: 3000
      reason: AdGuardHome UI for local and remote administration

    - srcs:
        - management
        - vpn
      proto: tcp
      port: 22
      reason: Router SSH for local and remote administration

    - src: vpn
      proto: tcp
      port: 53
      reason: Remote DNS TCP

    - src: vpn
      proto: udp
      port: 53
      reason: Remote DNS UDP

  management_flows:
    - srcs:
        - management
        - vpn
      dest: proxmox
      proto: tcp
      port: 8006
      reason: Proxmox HTTPS administration

    - srcs:
        - management
        - vpn
      dest: proxmox
      proto: tcp
      port: 22
      reason: Proxmox SSH administration

    - srcs:
        - management
        - vpn
      dest: truenas
      proto: tcp
      port: 443
      reason: TrueNAS HTTPS administration

    - srcs:
        - management
        - vpn
      dest: truenas
      proto: tcp
      port: 22
      reason: TrueNAS SSH administration

    - srcs:
        - management
        - vpn
      dest: kubelab
      proto: tcp
      port: 50000
      reason: Talos API administration

    - srcs:
        - management
        - vpn
      dest: kubelab
      proto: tcp
      port: 6443
      reason: Kubernetes API administration

    - srcs:
        - management
        - vpn
      dest: kubelab
      proto: tcp
      port: 80
      reason: Kubernetes ingress HTTP administration

    - srcs:
        - management
        - vpn
      dest: kubelab
      proto: tcp
      port: 443
      reason: Kubernetes ingress HTTPS administration

    - srcs:
        - management
        - vpn
      dest: kubelab
      proto: tcp
      port: 22
      reason: Kubernetes node SSH administration

    - srcs:
        - management
        - vpn
      dest: homelab
      proto: tcp
      port: 80
      reason: Homelab HTTP access

    - srcs:
        - management
        - vpn
      dest: homelab
      proto: tcp
      port: 443
      reason: Homelab HTTPS access

    - srcs:
        - management
        - vpn
      dest: homelab
      proto: tcp
      port: 22
      reason: Docker Swarm node SSH administration

  data_flows:
    - srcs:
        - management
        - vpn
      dest: truenas
      proto: tcp
      port: 2049
      reason: NFSv4 storage access

    - src: truenas
      dest: proxmox
      proto: tcp
      port: 22
      reason: Proxmox SSH access from TrueNAS

    - src: proxmox
      dest: truenas
      proto: tcp
      port: 2049
      reason: NFSv4

    - src: kubelab
      dest: truenas
      proto: tcp
      port: 2049
      reason: NFSv4

    - src: homelab
      dest: truenas
      proto: tcp
      port: 2049
      reason: Docker Swarm NFSv4 storage

  wan_rules:
    - src: wan
      proto: udp
      src_port: 547
      port: 546
      family: ipv6
      reason: DHCPv6 client replies

    - src: wan
      proto: icmp
      family: ipv6
      limit: 1000/sec
      icmp_types:
        - echo-request
        - echo-reply
        - destination-unreachable
        - packet-too-big
        - time-exceeded
        - bad-header
        - unknown-header-type
        - router-solicitation
        - neighbour-solicitation
        - router-advertisement
        - neighbour-advertisement
      reason: Required IPv6 control traffic to router

    - src: wan
      dest: "*"
      proto: icmp
      family: ipv6
      limit: 1000/sec
      icmp_types:
        - echo-request
        - echo-reply
        - destination-unreachable
        - packet-too-big
        - time-exceeded
        - bad-header
        - unknown-header-type
      reason: Required forwarded IPv6 ICMP

wireless:
  radios:
    - name: radio0
      path: platform/soc/18000000.wifi
      band: 2g
      htmode: HE40

    - name: radio1
      path: platform/soc/18000000.wifi+1
      band: 5g
      htmode: HE160

  interfaces:
    - name: wifinet0
      device: radio0
      suffix: "2.4"
      secret_key: 2g
      network: clients
      isolate: true

    - name: wifinet1
      device: radio1
      suffix: "5"
      secret_key: 5g
      network: management
      isolate: false

adguardhome:
  http_address: 10.10.0.1:3000

  dns:
    bind_hosts:
      - 0.0.0.0

    port: 53

    upstream_dns:
      - https://dns11.quad9.net/dns-query
      - https://family.dns.mullvad.net/dns-query

    bootstrap_dns:
      - 9.9.9.11
      - 149.112.112.11
      - "2620:fe::11"
      - "2620:fe::fe:11"

    upstream_mode: parallel
    use_http3_upstreams: true
    cache_enabled: true
    cache_size: 4194304
    cache_optimistic: true
    enable_dnssec: true
    serve_http3: true

  filters:
    - enabled: true
      url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.txt
      name: "HaGeZi's Threat Intelligence Feeds DNS Blocklist"
      id: 1770480370

    - enabled: true
      url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/spam-tlds.txt
      name: "HaGeZi's The World's Most Abused TLDs"
      id: 1770480371

    - enabled: true
      url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/ultimate.txt
      name: "HaGeZi's Ultimate DNS Blocklist"
      id: 1770480372

    - enabled: true
      url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adguard/dns-rebind-protection.txt
      name: "HaGeZi's DNS Rebind Protection"
      id: 1770480373

dropbear:
  name: main
  password_auth: "off"
  root_password_auth: "off"
  port: 22
  authorized_keys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBjCf1PpvoMshFkoyjFOYUJ6/pLexwEFqr29COJawkoB old_key
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPTAawDXqCZS9g+Q+2/L8chJ5gD97WLaKKi6DG4nccuA openpgp:0x3602CA24

crontab:
  root:
    - "0 */2 * * * /sbin/ifdown wan; /sbin/ifdown wan6; sleep 5; /sbin/ifup wan6; sleep 5; /sbin/ifup wan"
    - "0 0,12 * * * /sbin/reboot"

services:
  enable:
    - cron
    - adguardhome
    - irqbalance

  disable:
    - odhcpd
