name: Update OpenWrt

on:
  schedule:
    # Every Monday at 04:17 UTC
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-openwrt
  cancel-in-progress: false

jobs:
  update:
    name: Update OpenWrt release and hash
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Update OpenWrt metadata
        id: update
        run: |
          nix develop --command task update
          version=$(nix develop --command yq -r ".build.openwrt_version" config/router.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate flake
        run: nix flake check --print-build-logs

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/update-openwrt
          delete-branch: true
          sign-commits: true

          add-paths: |
            config/router.yaml
            README.md

          title: "chore(build): update OpenWrt to ${{ steps.update.outputs.version }}"
          commit-message: "chore(build): update OpenWrt to ${{ steps.update.outputs.version }}"
          body-path: build/openwrt-release-notes.md
